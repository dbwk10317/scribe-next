# scribe-next 기본 설정(Docker 이미지와 systemd 서비스 공용): 1463에서 받아 모든 category를
# /var/log/scribed/<category>/에 쓴다. 설치 위치는 /etc/scribe/scribe.conf다.
# Docker는 그 위에 mount하고(docs/docker.md), systemd는 examples/scribed.service가 그 경로를 읽는다.

# 수신 port(Thrift framed binary)
port=1463

<store>
  # default: 따로 정의하지 않은 모든 category에 이 store를 복제해 쓴다.
  category=default
  # 로컬 파일 store
  type=file
  # category별 하위 디렉터리가 이 경로 아래에 생긴다.
  file_path=/var/log/scribed
  # 복제할 때 category 이름으로 바뀐다(없으면 경고만 남는다).
  base_filename=default
  # 메시지마다 줄바꿈을 하나 덧붙인다(메시지에 이미 있어도 추가).
  add_newlines=1
  # 날이 바뀐 뒤 rotate_hour:rotate_minute(기본 현지 시각 01:15)가 지나면 새 파일
  # <category>-YYYY-MM-DD_00000을 연다(자정이 아니다).
  rotate_period=daily
  # 이 크기(bytes, 1 GiB)를 넘으면 번호를 올린 새 파일을 연다.
  max_size=1073741824
  # 현재 파일을 가리키는 <category>_current symlink를 만든다.
  create_symlink=yes
</store>
